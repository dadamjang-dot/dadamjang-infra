name: staging terraform plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
      TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
      TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
      TF_VAR_api_hostname: ${{ vars.API_HOSTNAME }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_r2_final_bucket_name: ${{ vars.CLOUDFLARE_R2_FINAL_BUCKET_NAME }}
    steps:
      - name: Validate Terraform inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TERRAFORM_PLAN_TOKEN }}
        run: |
          : "${TF_VAR_acm_certificate_arn:?ACM_CERTIFICATE_ARN is required}"
          : "${TF_VAR_api_hostname:?API_HOSTNAME is required}"
          : "${TF_VAR_cloudflare_account_id:?CLOUDFLARE_ACCOUNT_ID is required}"
          : "${TF_VAR_cloudflare_r2_final_bucket_name:?CLOUDFLARE_R2_FINAL_BUCKET_NAME is required}"
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_TERRAFORM_PLAN_TOKEN is required}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          cli_config_credentials_hostname: app.terraform.io
          cli_config_credentials_token: ${{ secrets.HCP_TERRAFORM_PLAN_TOKEN }}
          terraform_version: 1.15.7
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
      - name: Write Terraform backend configuration
        run: printf '%s' "$TF_BACKEND_CONFIG" > terraform/staging/backend.hcl
      - name: Initialize Terraform state backend
        run: terraform -chdir=terraform/staging init -input=false -backend-config=backend.hcl
      - name: Terraform plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TERRAFORM_PLAN_TOKEN }}
        run: terraform -chdir=terraform/staging plan -input=false -out=staging.tfplan
