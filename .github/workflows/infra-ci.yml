name: infra ci

on:
  pull_request:
    paths:
      - ".github/workflows/infra-ci.yml"
      - ".github/workflows/terraform-apply.yml"
      - "docker-compose.yml"
      - "terraform/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/infra-ci.yml"
      - ".github/workflows/terraform-apply.yml"
      - "docker-compose.yml"
      - "terraform/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Check Terraform formatting
        run: terraform -chdir=terraform/staging fmt -check -recursive
      - name: Initialize Terraform without a state backend
        run: terraform -chdir=terraform/staging init -backend=false -input=false
      - name: Validate Terraform
        run: terraform -chdir=terraform/staging validate
