name: staging api deploy

on:
  repository_dispatch:
    types: [backend-main]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: dadamjang-be ref to build and deploy
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      backend_sha: ${{ steps.release.outputs.backend_sha }}
      image_tag: ${{ steps.release.outputs.image_tag }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dadamjang_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dadamjang_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      BACKEND_REF: ${{ github.event.client_payload.ref || inputs.backend_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: infra
      - uses: actions/checkout@v4
        with:
          repository: dadamjang-dot/dadamjang-be
          ref: ${{ env.BACKEND_REF }}
          path: backend
      - name: Resolve release identity
        id: release
        run: |
          backend_sha=$(git -C backend rev-parse HEAD)
          dockerfile_sha=$(git -C infra hash-object docker/backend.Dockerfile)
          echo "backend_sha=$backend_sha" >> "$GITHUB_OUTPUT"
          echo "image_tag=backend-${backend_sha}-dockerfile-${dockerfile_sha}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: backend
        run: pnpm lint
      - name: Test
        working-directory: backend
        run: pnpm test --runInBand
      - name: Build
        working-directory: backend
        run: pnpm build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: staging-api-deploy
      cancel-in-progress: false
    environment:
      name: staging
    env:
      AWS_ECS_CLUSTER: ${{ vars.AWS_ECS_CLUSTER }}
      AWS_ECS_SERVICE: ${{ vars.AWS_ECS_SERVICE }}
      AWS_ECS_TASK_FAMILY: ${{ vars.AWS_ECS_TASK_FAMILY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ secrets.AWS_API_DEPLOY_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: infra
      - uses: actions/checkout@v4
        with:
          repository: dadamjang-dot/dadamjang-be
          ref: ${{ needs.test.outputs.backend_sha }}
          path: backend
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - name: Build or reuse immutable image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ needs.test.outputs.image_tag }}
        run: bash infra/scripts/publish-backend-image.sh "$REGISTRY" "$ECR_REPOSITORY" "$IMAGE_TAG" infra/docker/backend.Dockerfile backend
      - name: Read active ECS task definition
        run: aws ecs describe-task-definition --task-definition "$AWS_ECS_TASK_FAMILY" --query taskDefinition > task-definition.json
      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: task-definition
        with:
          task-definition: task-definition.json
          container-name: api
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.test.outputs.image_tag }}
          environment-variables: |
            SENTRY_RELEASE=${{ needs.test.outputs.image_tag }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        id: register-task-definition
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
      - name: Migrate and deploy registered task definition
        env:
          TASK_DEFINITION_ARN: ${{ steps.register-task-definition.outputs.task-definition-arn }}
        run: bash infra/scripts/deploy-ecs-release.sh
