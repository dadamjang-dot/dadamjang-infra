name: staging api deploy

on:
  repository_dispatch:
    types: [backend-main]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: dadamjang-be ref to build and deploy
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dadamjang_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dadamjang_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      BACKEND_REF: ${{ github.event.client_payload.ref || inputs.backend_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dadamjang-dot/dadamjang-be
          ref: ${{ env.BACKEND_REF }}
          path: backend
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: backend
        run: pnpm lint
      - name: Test
        working-directory: backend
        run: pnpm test --runInBand
      - name: Build
        working-directory: backend
        run: pnpm build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      AWS_ECS_CLUSTER: ${{ vars.AWS_ECS_CLUSTER }}
      AWS_ECS_SERVICE: ${{ vars.AWS_ECS_SERVICE }}
      AWS_ECS_TASK_FAMILY: ${{ vars.AWS_ECS_TASK_FAMILY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ secrets.AWS_API_DEPLOY_ROLE_ARN }}
      BACKEND_REF: ${{ github.event.client_payload.ref || inputs.backend_ref || 'main' }}
      ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: infra
      - uses: actions/checkout@v4
        with:
          repository: dadamjang-dot/dadamjang-be
          ref: ${{ env.BACKEND_REF }}
          path: backend
      - name: Resolve backend image tag
        id: backend-commit
        run: echo "sha=$(git -C backend rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - name: Build and push immutable image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.backend-commit.outputs.sha }}
        run: |
          docker build --file infra/docker/backend.Dockerfile --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" backend
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
      - name: Run database migrations
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.backend-commit.outputs.sha }}
        run: |
          network_config=$(aws ecs describe-services --cluster "$AWS_ECS_CLUSTER" --service "$AWS_ECS_SERVICE" --query 'services[0].networkConfiguration.awsvpcConfiguration' --output json)
          subnets=$(echo "$network_config" | jq -r '.subnets | join(",")')
          security_groups=$(echo "$network_config" | jq -r '.securityGroups | join(",")')
          task_arn=$(aws ecs run-task \
            --cluster "$AWS_ECS_CLUSTER" \
            --task-definition "$AWS_ECS_TASK_FAMILY" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$subnets],securityGroups=[$security_groups],assignPublicIp=DISABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"api\",\"image\":\"$IMAGE\",\"command\":[\"node\",\"dist/scripts/migrate.js\"]}]}" \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$AWS_ECS_CLUSTER" --tasks "$task_arn"
          exit_code=$(aws ecs describe-tasks --cluster "$AWS_ECS_CLUSTER" --tasks "$task_arn" --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$exit_code" != "0" ]; then
            echo "Migration failed with exit code $exit_code"
            exit 1
          fi
      - name: Read active ECS task definition
        run: aws ecs describe-task-definition --task-definition "$AWS_ECS_TASK_FAMILY" --query taskDefinition > task-definition.json
      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: task-definition
        with:
          task-definition: task-definition.json
          container-name: api
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.backend-commit.outputs.sha }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          service: ${{ env.AWS_ECS_SERVICE }}
          cluster: ${{ env.AWS_ECS_CLUSTER }}
          wait-for-service-stability: true
      - name: Start the staging API service
        run: |
          aws ecs update-service --cluster "$AWS_ECS_CLUSTER" --service "$AWS_ECS_SERVICE" --desired-count 1 >/dev/null
          aws ecs wait services-stable --cluster "$AWS_ECS_CLUSTER" --services "$AWS_ECS_SERVICE"
