name: staging api deploy

on:
  repository_dispatch:
    types: [backend-main]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: dadamjang-be ref to build and deploy
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      backend_sha: ${{ steps.release.outputs.backend_sha }}
      image_tag: ${{ steps.release.outputs.image_tag }}
    services:
      postgres:
        image: postgres:16.15-alpine3.24@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dadamjang_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dadamjang_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Resolve backend ref
        id: backend-ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY_DISPATCH_REF: ${{ github.event.client_payload.ref }}
          WORKFLOW_DISPATCH_REF: ${{ inputs.backend_ref }}
        run: |
          case "$EVENT_NAME" in
            repository_dispatch)
              if [[ ! "$REPOSITORY_DISPATCH_REF" =~ ^[0-9a-f]{40}$ ]]; then
                printf 'repository_dispatch ref must be a full commit SHA\n' >&2
                exit 1
              fi
              backend_ref="$REPOSITORY_DISPATCH_REF"
              ;;
            workflow_dispatch)
              if [[ ! "$WORKFLOW_DISPATCH_REF" =~ ^[^[:space:]]+$ ]]; then
                printf 'workflow_dispatch ref must be non-empty and contain no whitespace\n' >&2
                exit 1
              fi
              backend_ref="$WORKFLOW_DISPATCH_REF"
              ;;
            *)
              printf 'unsupported deployment event: %s\n' "$EVENT_NAME" >&2
              exit 1
              ;;
          esac
          printf 'backend_ref=%s\n' "$backend_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: infra
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: dadamjang-dot/dadamjang-be
          ref: ${{ steps.backend-ref.outputs.backend_ref }}
          path: backend
      - name: Resolve release identity
        id: release
        run: |
          backend_sha=$(git -C backend rev-parse HEAD)
          dockerfile_sha=$(git -C infra hash-object docker/backend.Dockerfile)
          echo "backend_sha=$backend_sha" >> "$GITHUB_OUTPUT"
          echo "image_tag=backend-${backend_sha}-dockerfile-${dockerfile_sha}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: backend
        run: pnpm lint
      - name: Test
        working-directory: backend
        run: pnpm test --runInBand
      - name: Build
        working-directory: backend
        run: pnpm build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: staging-api-deploy
      cancel-in-progress: false
    environment:
      name: staging
    env:
      AWS_ECS_CLUSTER: ${{ vars.AWS_ECS_CLUSTER }}
      AWS_ECS_SERVICE: ${{ vars.AWS_ECS_SERVICE }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ secrets.AWS_API_DEPLOY_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: infra
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: dadamjang-dot/dadamjang-be
          ref: ${{ needs.test.outputs.backend_sha }}
          path: backend
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        id: ecr-login
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          cli_config_credentials_token: ${{ secrets.HCP_TERRAFORM_TOKEN }}
          terraform_version: 1.15.7
          terraform_wrapper: false
      - name: Build or reuse immutable image
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ needs.test.outputs.image_tag }}
        run: bash infra/scripts/publish-backend-image.sh "$REGISTRY" "$ECR_REPOSITORY" "$IMAGE_TAG" infra/docker/backend.Dockerfile backend | sed 's/^/reference=/' >> "$GITHUB_OUTPUT"
      - name: Write Terraform backend configuration
        env:
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
        run: printf '%s' "$TF_BACKEND_CONFIG" > infra/terraform/staging/backend.hcl
      - name: Initialize Terraform state backend
        run: terraform -chdir=infra/terraform/staging init -input=false -backend-config=backend.hcl
      - name: Prepare reviewed ECS task definition
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          SENTRY_RELEASE: ${{ needs.test.outputs.image_tag }}
        run: bash infra/scripts/prepare-ecs-task-definition.sh infra/terraform/staging task-definition.json
      - uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        id: register-task-definition
        with:
          task-definition: task-definition.json
      - name: Migrate and deploy registered task definition
        env:
          TASK_DEFINITION_ARN: ${{ steps.register-task-definition.outputs.task-definition-arn }}
        run: bash infra/scripts/deploy-ecs-release.sh
